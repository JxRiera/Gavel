name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Reject duplicate jar entries
        run: |
          jar=$(ls build/libs/Gavel-*.jar)
          duplicates=$(zipinfo -1 "$jar" | grep -v '/$' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate entries in $jar, Paper's plugin remapper will refuse it:"
            echo "$duplicates"
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Gavel
          path: build/libs/Gavel-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Gavel
          path: dist

      - name: Resolve version
        id: version
        run: |
          count=$(ls dist/Gavel-*.jar | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one jar, found $count"
            exit 1
          fi
          jar=$(ls dist/Gavel-*.jar)
          version=$(basename "$jar" .jar)
          version=${version#Gavel-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gavel ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
