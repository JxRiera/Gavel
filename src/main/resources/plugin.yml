name: Gavel
version: '${version}'
main: dev.jxriera.gavel.Gavel
api-version: '1.16'
authors: [jxriera]
description: GUI punishment overlay with automatic escalation, built on top of LiteBans.
depend: [LiteBans]
softdepend: [PlaceholderAPI]

commands:
  gavel:
    description: Open the punishment overlay and manage the plugin.
    aliases: [gv]
    usage: /gavel help
    permission: gavel.use
    permission-message: ''

permissions:
  gavel.use:
    description: Opens the overlay when a punishment command is used.
    default: op
  gavel.bypass:
    description: Runs the raw LiteBans commands without the overlay.
    default: false
  gavel.category.*:
    description: Access to every category.
    default: op
  gavel.history:
    description: View a player's Gavel history.
    default: op
  gavel.stats:
    description: View the punishment statistics.
    default: op
  gavel.undo:
    description: Undo the last punishment Gavel applied to a player.
    default: op
  gavel.silent:
    description: Apply punishments silently.
    default: op
  gavel.admin:
    description: Reload the configuration and clear histories.
    default: op
